<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">GENIE — Phase 1 System Architecture</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748b">Fully on-prem voice AI · ESP32-S3 · Flask · Whisper · Mistral 7B · pyttsx3</text>

  <!-- ─── Left: Edge device (ESP32-S3) ─── -->
  <rect x="40" y="100" width="280" height="380" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#soft)"/>
  <text x="180" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">EDGE — ESP32-S3 DevKitC-1</text>
  <text x="180" y="146" text-anchor="middle" font-size="11" fill="#92400e">~$10 · 240 MHz dual-core · 8 MB PSRAM</text>

  <!-- User -->
  <circle cx="180" cy="190" r="22" fill="#fff" stroke="#92400e" stroke-width="2"/>
  <text x="180" y="195" text-anchor="middle" font-size="20">🗣️</text>
  <text x="180" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">User speaks</text>

  <!-- Mic -->
  <rect x="100" y="252" width="160" height="58" rx="8" fill="#fff" stroke="#f59e0b"/>
  <text x="180" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">INMP441 mic</text>
  <text x="180" y="290" text-anchor="middle" font-size="10" fill="#64748b">I2S · 32-bit · GPIO 5/6/7</text>
  <text x="180" y="304" text-anchor="middle" font-size="10" fill="#64748b">L/R → GND (right channel)</text>

  <!-- ESP32 -->
  <rect x="80" y="332" width="200" height="128" rx="8" fill="#fff" stroke="#f59e0b"/>
  <text x="180" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">main.cpp on ESP32-S3</text>
  <text x="180" y="372" text-anchor="middle" font-size="10" fill="#475569">>>13 bit-shift tuning</text>
  <text x="180" y="386" text-anchor="middle" font-size="10" fill="#475569">7s buffer · 16 kHz mono</text>
  <text x="180" y="400" text-anchor="middle" font-size="10" fill="#475569">WAV header build</text>
  <text x="180" y="414" text-anchor="middle" font-size="10" fill="#475569">BOOT button push-to-talk</text>
  <text x="180" y="441" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">HTTP POST /audio</text>

  <!-- Arrows inside edge -->
  <line x1="180" y1="214" x2="180" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="180" y1="310" x2="180" y2="330" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ─── Middle: WiFi link ─── -->
  <path d="M320 396 C 360 396, 400 396, 440 396" fill="none" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrow-r)"/>
  <text x="380" y="386" text-anchor="middle" font-size="11" fill="#0ea5e9" font-weight="600">WAV bytes</text>
  <text x="380" y="412" text-anchor="middle" font-size="10" fill="#0ea5e9">local WiFi · port 5000</text>

  <!-- Reply arrow -->
  <path d="M440 200 C 400 200, 360 200, 320 200" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
  <text x="380" y="190" text-anchor="middle" font-size="11" fill="#10b981" font-weight="600">JSON: genie_reply</text>
  <text x="380" y="216" text-anchor="middle" font-size="10" fill="#10b981">user hears laptop speakers</text>

  <!-- ─── Right: Laptop / AI stack ─── -->
  <rect x="440" y="100" width="620" height="380" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" filter="url(#soft)"/>
  <text x="750" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">LAPTOP — Local AI Stack (no cloud)</text>
  <text x="750" y="146" text-anchor="middle" font-size="11" fill="#0369a1">Windows 11 · RTX 4060 · Ollama + Python 3.11</text>

  <!-- Flask -->
  <rect x="466" y="252" width="180" height="76" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="556" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Flask · app.py</text>
  <text x="556" y="291" text-anchor="middle" font-size="10" fill="#64748b">/audio endpoint</text>
  <text x="556" y="305" text-anchor="middle" font-size="10" fill="#64748b">archives WAV in</text>
  <text x="556" y="319" text-anchor="middle" font-size="10" fill="#64748b">recordings/rec_{ts}.wav</text>

  <!-- Whisper -->
  <rect x="676" y="170" width="170" height="76" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="761" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1. Whisper</text>
  <text x="761" y="209" text-anchor="middle" font-size="10" fill="#64748b">base model · STT</text>
  <text x="761" y="223" text-anchor="middle" font-size="10" fill="#64748b">CUDA on RTX 4060</text>
  <text x="761" y="237" text-anchor="middle" font-size="10" fill="#64748b">~2 s for 7 s clip</text>

  <!-- Mistral / Ollama -->
  <rect x="676" y="260" width="170" height="76" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="761" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">2. Mistral 7B</text>
  <text x="761" y="299" text-anchor="middle" font-size="10" fill="#64748b">via Ollama :11434</text>
  <text x="761" y="313" text-anchor="middle" font-size="10" fill="#64748b">1–2 sentence persona</text>
  <text x="761" y="327" text-anchor="middle" font-size="10" fill="#64748b">~4–10 s response</text>

  <!-- pyttsx3 -->
  <rect x="676" y="350" width="170" height="76" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="761" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">3. pyttsx3</text>
  <text x="761" y="389" text-anchor="middle" font-size="10" fill="#64748b">offline TTS</text>
  <text x="761" y="403" text-anchor="middle" font-size="10" fill="#64748b">plays on laptop</text>
  <text x="761" y="417" text-anchor="middle" font-size="10" fill="#64748b">speakers (Phase 1)</text>

  <!-- Arrows Flask -> Whisper -> Mistral -> pyttsx3 -->
  <path d="M646 280 C 660 280, 666 220, 676 208" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="761" y1="246" x2="761" y2="258" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="761" y1="336" x2="761" y2="348" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- pyttsx3 -> back to Flask response -->
  <path d="M676 388 C 620 388, 600 360, 596 328" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-r)"/>

  <!-- Right side: latency callout -->
  <rect x="884" y="170" width="160" height="120" rx="8" fill="#fff" stroke="#0ea5e9" stroke-dasharray="4 3"/>
  <text x="964" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">End-to-end</text>
  <text x="964" y="222" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">8 – 15 s</text>
  <text x="964" y="246" text-anchor="middle" font-size="10" fill="#64748b">user click → audible reply</text>
  <text x="964" y="270" text-anchor="middle" font-size="10" fill="#64748b">zero cloud round-trips</text>

  <!-- Right side: cost callout -->
  <rect x="884" y="304" width="160" height="120" rx="8" fill="#fff" stroke="#0ea5e9" stroke-dasharray="4 3"/>
  <text x="964" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">Hardware BOM</text>
  <text x="964" y="356" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">~ $22</text>
  <text x="964" y="380" text-anchor="middle" font-size="10" fill="#64748b">ESP32-S3 + INMP441</text>
  <text x="964" y="394" text-anchor="middle" font-size="10" fill="#64748b">+ wires + breadboard</text>

  <!-- Footer legend -->
  <g transform="translate(40, 504)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0ea5e9" stroke-width="2.5"/>
    <text x="38" y="4" font-size="11" fill="#475569">request audio</text>
    <line x1="150" y1="0" x2="180" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="188" y="4" font-size="11" fill="#475569">reply audio (Phase 1: laptop speakers · Phase 2: ESP32 → MAX98357A → 3 W speaker)</text>
  </g>
</svg>
